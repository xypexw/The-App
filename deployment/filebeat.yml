filebeat.inputs:
  - type: filestream
    id: peacock-app-logs
    enabled: true
    paths:
      - /var/log/peacock/*.log
    parsers:
      - multiline:
          type: pattern
          pattern: '^[0-9]{4}-[0-9]{2}-[0-9]{2}'
          negate: true
          match: after

output.elasticsearch:
  hosts: ["http://${MONITORING_HOST}:9200"]

logging.level: info
logging.to_files: false