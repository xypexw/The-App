global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'PeacockXT'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['${APP_HOST}:8080']

  # Windows Exporter
  - job_name: 'windows-exporter'
    static_configs:
      - targets: [ '${WINDOWS_HOST}:9182' ]

  # Redis Exporter
  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['${APP_HOST}:9121']

  - job_name: 'PeacockBFF'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['${APP_HOST}:8081']
